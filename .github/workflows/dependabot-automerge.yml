name: dependabot auto-merge

# Minor and patch bumps merge themselves once the required checks on main pass;
# a major waits for a person, because a major is an API change someone has to
# read. Merging here still releases nothing: mast only moves when a v2.x.y tag
# is pushed (FORK.md, "Keeping it current").
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
