name: build

on:
    push:
    pull_request:
    # actions were disabled while this was a fork, so there has to be a way to
    # run the suite without inventing a commit for it.
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.21
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./... && echo true

  coverage:
    name: Test with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.21'
      - name: Check out code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          go mod download
      - name: Run Unit tests
        run: |
          go test -race -covermode atomic -coverprofile=covprofile ./...
      - name: Report coverage
        run: go tool cover -func=covprofile | tail -1
